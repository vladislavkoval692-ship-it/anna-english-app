<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anna's English School</title>
    
    <!-- Telegram WebApp & Supabase SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title { font-size: 22px; font-weight: 700; }
        .subtitle { font-size: 13px; color: var(--text-muted); }

        .vip-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* Навигация */
        .nav-tabs {
            display: flex;
            background: #1e293b;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .nav-btn {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            border: none;
            background: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .section { display: none; }
        .section.active { display: block; }

        /* Карточки */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        
        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-main:active { background: var(--accent-hover); }

        /* Уроки и Сетка */
        .day-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            margin: 16px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lesson-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-time { font-size: 15px; font-weight: 700; color: #fff; }
        .lesson-student { font-size: 14px; color: var(--text-muted); }
        .lesson-actions { display: flex; gap: 8px; align-items: center; }

        .zoom-btn {
            background: #2563eb;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        .status-chip {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .status-chip.done { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-chip.pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .student-row:last-child { border-bottom: none; }
        .delete-btn { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; }

        .stat-value { font-size: 32px; font-weight: 700; color: var(--success); margin-top: 8px; }
        .limit-text { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="title" id="user-greeting">Anna's English School</div>
            <div class="subtitle">Планирование & Расписание</div>
        </div>
        <div id="vip-status"></div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="setTab('schedule')">Расписание</button>
        <button class="nav-btn" onclick="setTab('students')">Ученики</button>
        <button class="nav-btn" onclick="setTab('stats')">Доходы</button>
    </div>

    <!-- РАСПИСАНИЕ -->
    <div id="schedule" class="section active">
        <div class="card">
            <div class="card-title">Добавить урок</div>
            <div class="form-group">
                <label>День недели</label>
                <select id="lesson-day">
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                    <option value="Суббота">Суббота</option>
                    <option value="Воскресенье">Воскресенье</option>
                </select>
            </div>
            <div class="form-group">
                <label>Время</label>
                <input type="time" id="lesson-time" value="12:00">
            </div>
            <div class="form-group">
                <label>Ученик</label>
                <select id="lesson-student-select"></select>
            </div>
            <div class="form-group">
                <label>Ссылка на Zoom (необязательно)</label>
                <input type="url" id="lesson-zoom" placeholder="https://zoom.us/j/...">
            </div>
            <button class="btn-main" onclick="addLesson()">Запланировать урок</button>
        </div>

        <div class="card">
            <div class="card-title">Уроки на неделю</div>
            <div id="lessons-container"></div>
        </div>
    </div>

    <!-- УЧЕНИКИ -->
    <div id="students" class="section">
        <div class="card">
            <div class="card-title">
                Новый ученик
                <span id="limit-counter" class="limit-text"></span>
            </div>
            <div class="form-group">
                <label>Имя Ученика</label>
                <input type="text" id="student-name" placeholder="Например: Максим">
            </div>
            <div class="form-group">
                <label>Ставка за урок (₴)</label>
                <input type="number" id="student-rate" placeholder="400">
            </div>
            <button class="btn-main" onclick="addStudent()">Сохранить ученика</button>
        </div>

        <div class="card">
            <div class="card-title">Мои Ученики</div>
            <div id="students-container"></div>
        </div>
    </div>

    <!-- ДОХОДЫ -->
    <div id="stats" class="section">
        <div class="card">
            <div class="card-title">Заработано за неделю</div>
            <div class="stat-value" id="total-earned">0 ₴</div>
            <div class="subtitle" style="margin-top: 8px;">Считаются только выполненные уроки</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://myxospyofguyjskpbfnt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__yFLFUaOvySO0Kfq3kynaw_AltSdqzX';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Telegram WebApp Init
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const user = tg?.initDataUnsafe?.user || { id: 'test_user_123', first_name: 'Анна' };
        
        // Список VIP без ограничений (ID Анны запишем сюда)
        const VIP_USER_IDS = ['test_user_123']; 
        const isVip = VIP_USER_IDS.includes(String(user.id));
        const MAX_FREE = 5;

        let students = [];
        let lessons = [];

        // Инициализация
        document.getElementById('user-greeting').innerText = `Привет, ${user.first_name}! 👋`;
        if (isVip) {
            document.getElementById('vip-status').innerHTML = '<span class="vip-badge">PRO VIP</span>';
        }

        async function init() {
            await ensureProfile();
            await loadData();
        }

        async function ensureProfile() {
            const { data } = await supabase.from('profiles').select('id').eq('id', String(user.id)).single();
            if (!data) {
                await supabase.from('profiles').insert([{ id: String(user.id), first_name: user.first_name || '', username: user.username || '' }]);
            }
        }

        async function loadData() {
            const { data: stData } = await supabase.from('students').select('*').eq('user_id', String(user.id));
            students = stData || [];

            const { data: lsData } = await supabase.from('lessons').select('*').eq('user_id', String(user.id));
            lessons = lsData || [];

            renderStudents();
            renderLessons();
            calculateStats();
        }

        function setTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }

        async function addStudent() {
            const name = document.getElementById('student-name').value.trim();
            const rate = parseFloat(document.getElementById('student-rate').value) || 0;

            if (!name) return alert('Укажите имя ученика');

            if (!isVip && students.length >= MAX_FREE) {
                return alert(`🚀 Вы достигли лимита бесплатного тарифа (${MAX_FREE} учеников).\n\nОформите PRO-подписку для безлимитного доступа!`);
            }

            const { data, error } = await supabase.from('students').insert([{ user_id: String(user.id), name, rate }]).select();
            if (!error && data) {
                students.push(data[0]);
                document.getElementById('student-name').value = '';
                document.getElementById('student-rate').value = '';
                renderStudents();
            }
        }

        async function deleteStudent(id) {
            await supabase.from('students').delete().eq('id', id);
            students = students.filter(s => s.id !== id);
            renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('students-container');
            const select = document.getElementById('lesson-student-select');
            const counter = document.getElementById('limit-counter');

            container.innerHTML = '';
            select.innerHTML = '';

            counter.innerText = isVip ? 'VIP Безлимит' : `${students.length}/${MAX_FREE} мест`;

            if (students.length === 0) {
                container.innerHTML = '<div class="subtitle">Учеников пока нет</div>';
                select.innerHTML = '<option value="">Сначала добавьте ученика</option>';
                return;
            }

            students.forEach(s => {
                container.innerHTML += `
                    <div class="student-row">
                        <div>
                            <strong style="color: #fff;">${s.name}</strong>
                            <div class="subtitle">${s.rate} ₴ / урок</div>
                        </div>
                        <button class="delete-btn" onclick="deleteStudent('${s.id}')">✕</button>
                    </div>
                `;
                select.innerHTML += `<option value="${s.name}">${s.name} (${s.rate} ₴)</option>`;
            });
        }

        async function addLesson() {
            const day = document.getElementById('lesson-day').value;
            const time = document.getElementById('lesson-time').value;
            const studentName = document.getElementById('lesson-student-select').value;
            const zoom = document.getElementById('lesson-zoom').value.trim();

            if (!studentName) return alert('Выберите ученика');

            const st = students.find(s => s.name === studentName);
            const rate = st ? st.rate : 0;

            const { data, error } = await supabase.from('lessons').insert([{
                user_id: String(user.id),
                day,
                time,
                student_name: studentName,
                rate,
                completed: false
            }]).select();

            if (!error && data) {
                lessons.push(data[0]);
                document.getElementById('lesson-zoom').value = '';
                renderLessons();
                calculateStats();
            }
        }

        async function toggleLesson(id) {
            const l = lessons.find(x => x.id === id);
            if (!l) return;

            const newStatus = !l.completed;
            const { error } = await supabase.from('lessons').update({ completed: newStatus }).eq('id', id);
            if (!error) {
                l.completed = newStatus;
                renderLessons();
                calculateStats();
            }
        }

        function renderLessons() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';

            if (lessons.length === 0) {
                container.innerHTML = '<div class="subtitle">Уроков на эту неделю пока нет</div>';
                return;
            }

            const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];

            days.forEach(d => {
                const dayLessons = lessons.filter(l => l.day === d);
                if (dayLessons.length > 0) {
                    container.innerHTML += `<div class="day-header">${d}</div>`;
                    dayLessons.forEach(l => {
                        container.innerHTML += `
                            <div class="lesson-card">
                                <div>
                                    <div class="lesson-time">${l.time}</div>
                                    <div class="lesson-student">${l.student_name} (${l.rate} ₴)</div>
                                </div>
                                <div class="lesson-actions">
                                    <button class="status-chip ${l.completed ? 'done' : 'pending'}" onclick="toggleLesson('${l.id}')">
                                        ${l.completed ? 'Проведён' : 'Ожидает'}
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }
            });
        }

        function calculateStats() {
            const total = lessons.filter(l => l.completed).reduce((sum, l) => sum + (Number(l.rate) || 0), 0);
            document.getElementById('total-earned').innerText = `${total} ₴`;
        }

        init();
    </script>
</body>
</html>
