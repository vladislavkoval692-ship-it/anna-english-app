<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English School App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --zoom: #38bdf8;
            --gold: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 14px;
            padding-bottom: 50px;
            -webkit-tap-highlight-color: transparent;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.4px;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-zoom-main {
            background: rgba(56, 189, 248, 0.15);
            color: var(--zoom);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-premium-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 7px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-icon-top {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .settings-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 14px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .settings-bar.active { display: flex; }

        .settings-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .settings-field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lang-selector {
            display: flex;
            background: var(--bg);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .lang-btn {
            flex: 1;
            background: transparent;
            color: var(--text-sub);
            border: none;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .lang-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .stat-card h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
        }

        .student-badge-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .section-box {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .section-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .limit-info-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .form-grid.full { grid-template-columns: 1fr; }

        .form-actions { display: flex; gap: 8px; }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            color: var(--text-main);
            outline: none;
        }

        button {
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background: var(--primary); color: white; flex: 1; }

        .students-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .student-chip {
            background: var(--bg);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
        }

        .student-chip .del-btn {
            color: var(--text-sub);
            cursor: pointer;
            font-weight: bold;
        }

        .week-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .day-column {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            border: 1px solid var(--border);
        }

        .day-column.is-today {
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .day-header {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-sub);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-column.is-today .day-header { color: var(--primary); }

        .expand-toggle-btn {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            border: 1px dashed rgba(59, 130, 246, 0.4);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .other-days-block {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .other-days-block.show { display: flex; }

        .no-lessons {
            font-size: 12px;
            color: var(--text-sub);
            font-style: italic;
            padding: 4px 0;
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .lesson-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lesson-card.completed {
            border-left-color: var(--success);
            opacity: 0.7;
        }

        .lesson-info { display: flex; flex-direction: column; gap: 2px; }
        .lesson-time { font-size: 12px; font-weight: 700; color: var(--primary); }
        .lesson-student { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .lesson-actions { display: flex; gap: 6px; align-items: center; }

        .btn-sm { padding: 5px 9px; font-size: 11px; border-radius: 8px; }
        .btn-zoom-icon {
            background: rgba(56, 189, 248, 0.15);
            color: var(--zoom);
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-decoration: none;
            padding: 5px 9px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .btn-success-sm { background: var(--success); color: white; }
        .btn-danger-sm { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--card-bg);
            width: 100%; max-width: 360px;
            border-radius: 20px; padding: 20px;
            border: 1px solid var(--border); text-align: center;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { font-size: 16px; font-weight: 800; }
        .modal-close { background: var(--border); border: none; width: 28px; height: 28px; border-radius: 50%; color: var(--text-sub); cursor: pointer; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title" id="appTitle">English School</div>
        <div class="header-actions">
            <button class="btn-premium-badge">⭐ <span id="headerPlanText">Free</span></button>
            <button class="btn-zoom-main" onclick="openZoomLink()">🎥 Zoom</button>
            <button class="btn-icon-top" onclick="toggleSettingsInput()">⚙️</button>
        </div>
    </header>

    <div class="settings-bar" id="settingsBar">
        <div class="settings-field">
            <label id="lblLang">Мова / Language</label>
            <div class="lang-selector">
                <button class="lang-btn" data-lang="ru" onclick="selectLang('ru')">Русский</button>
                <button class="lang-btn active" data-lang="uk" onclick="selectLang('uk')">Українська</button>
                <button class="lang-btn" data-lang="en" onclick="selectLang('en')">English</button>
            </div>
        </div>
        <div class="settings-field">
            <label id="lblTeacherName">Ім'я викладача</label>
            <input type="text" id="teacherNameInput" placeholder="Вкажіть ваше ім'я...">
        </div>
        <div class="settings-field">
            <label id="lblZoomUrl">Посилання на Zoom</label>
            <input type="text" id="zoomUrl" placeholder="Вставте посилання...">
        </div>
        <button class="btn-primary" style="padding: 10px;" id="btnSaveSettings" onclick="saveSettings()">Зберегти налаштування</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3 id="lblCompletedStat">Проведено</h3>
            <div class="value" id="completedLessonsCount">0 / 0</div>
        </div>
        <div class="stat-card">
            <h3 id="lblTodayStat">Уроки сьогодні</h3>
            <div class="value" id="todayLessonsCount">0</div>
        </div>
        <div class="stat-card" style="cursor:pointer;" onclick="openStudentsModal()">
            <h3 id="lblStudentsStat">Студенти</h3>
            <div class="value">
                <span id="totalStudentsCount">0</span>
                <span class="student-badge-btn" id="btnStudentBadge">👥 Список</span>
            </div>
        </div>
        <div class="stat-card">
            <h3 id="lblEarnedStat">Зароблено</h3>
            <div class="value" id="earnedIncome">0 ₴</div>
        </div>
    </div>

    <div class="section-box">
        <div class="section-header-flex">
            <div class="section-title" id="lblStudentsSection">Студенти</div>
            <div class="limit-info-tag" id="limitTag">Безкоштовно: 0 / 3</div>
        </div>
        <div class="form-grid">
            <input type="text" id="studentName" placeholder="Ім'я">
            <input type="number" id="studentRate" placeholder="Ставка (₴)">
        </div>
        <div class="form-actions">
            <button class="btn-primary" id="btnAddStudent" onclick="addStudent()">Додати студента</button>
        </div>
        <div class="students-list" id="studentsList"></div>
    </div>

    <div class="section-box">
        <div class="section-title" id="lblScheduleSection" style="margin-bottom: 12px;">Запланувати урок</div>
        <div class="form-grid">
            <input type="date" id="lessonDate">
            <input type="time" id="lessonTime" value="12:00">
        </div>
        <div class="form-grid full" style="margin-bottom: 8px;">
            <select id="lessonStudentSelect">
                <option value="">Оберіть студента</option>
            </select>
        </div>
        <div class="form-actions">
            <button class="btn-primary" id="btnAddLesson" onclick="addLesson()">+ Запланувати урок</button>
        </div>
    </div>

    <div class="section-title" id="lblScheduleTitle" style="margin: 18px 2px 10px 2px;">Розклад занять</div>
    <div class="week-container" id="weekGrid"></div>

    <div class="modal-overlay" id="studentsModal" onclick="closeStudentsModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="lblModalTitle">Ваши учні 🎓</div>
                <button class="modal-close" onclick="closeStudentsModal()">✕</button>
            </div>
            <div id="modalStudentsList" style="text-align:left;"></div>
        </div>
    </div>

    <script>
        let tgUser = null;
        let userId = 'default_user';

        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                    userId = String(tgUser.id);
                }
            }
        } catch (e) {}

        const SUPABASE_URL = "https://myxospyofguyjskpbfnt.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable__yFLFUaOvySO0Kfq3kynaw_AltSdqzX"; 
        let db = null;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {}

        let currentLang = 'uk';
        const i18n = {
            ru: {
                days: ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"],
                months: ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"],
                teacherNameLbl: "Имя преподавателя", teacherNamePh: "Укажите ваше имя...",
                zoomUrlLbl: "Ссылка на Zoom", zoomUrlPh: "Вставьте ссылку...",
                saveSettingsBtn: "Сохранить настройки", completedStat: "Проведено",
                todayStat: "Уроки сегодня", studentsStat: "Студенты", earnedStat: "Заработано",
                badgeList: "👥 Список", studentsSection: "Студенты", studentNamePh: "Имя",
                studentRatePh: "Ставка (₴)", addStudentBtn: "Добавить студента",
                scheduleSection: "Запланировать урок", selectStudentDef: "Выберите студента",
                addLessonBtn: "+ Запланировать урок", scheduleTitle: "Расписание занятий",
                noLessons: "Нет уроков", todayTag: "• СЕГОДНЯ", expandSch: "Показать остальные дни ▼",
                collapseSch: "Свернуть расписание ▲", modalTitle: "Ваши ученики 🎓", noStudentsYet: "Студентов пока нет",
                freeLimitTag: "Бесплатно", proLimitTag: "PRO: Безлимит", unit: "ур."
            },
            uk: {
                days: ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"],
                months: ["січ", "лют", "бер", "квіт", "трав", "черв", "лип", "серп", "вер", "жовт", "лис", "груд"],
                teacherNameLbl: "Ім'я викладача", teacherNamePh: "Вкажіть ваше ім'я...",
                zoomUrlLbl: "Посилання на Zoom", zoomUrlPh: "Вставте посилання...",
                saveSettingsBtn: "Зберегти налаштування", completedStat: "Проведено",
                todayStat: "Уроки сьогодні", studentsStat: "Студенти", earnedStat: "Зароблено",
                badgeList: "👥 Список", studentsSection: "Студенти", studentNamePh: "Ім'я",
                studentRatePh: "Ставка (₴)", addStudentBtn: "Додати студента",
                scheduleSection: "Запланувати урок", selectStudentDef: "Оберіть студента",
                addLessonBtn: "+ Запланувати урок", scheduleTitle: "Розклад занять",
                noLessons: "Немає уроків", todayTag: "• СЬОГОДНІ", expandSch: "Показати інші дні ▼",
                collapseSch: "Згорнути розклад ▲", modalTitle: "Ваші учні 🎓", noStudentsYet: "Студентів поки немає",
                freeLimitTag: "Безкоштовно", proLimitTag: "PRO: Безліміт", unit: "ур."
            },
            en: {
                days: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                months: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
                teacherNameLbl: "Teacher's Name", teacherNamePh: "Enter your name...",
                zoomUrlLbl: "Zoom Link", zoomUrlPh: "Paste link...",
                saveSettingsBtn: "Save Settings", completedStat: "Completed",
                todayStat: "Lessons Today", studentsStat: "Students", earnedStat: "Earned",
                badgeList: "👥 List", studentsSection: "Students", studentNamePh: "Name",
                studentRatePh: "Rate (₴)", addStudentBtn: "Add Student",
                scheduleSection: "Schedule Lesson", selectStudentDef: "Select student",
                addLessonBtn: "+ Schedule Lesson", scheduleTitle: "Lesson Schedule",
                noLessons: "No lessons", todayTag: "• TODAY", expandSch: "Show other days ▼",
                collapseSch: "Collapse schedule ▲", modalTitle: "Your Students 🎓", noStudentsYet: "No students yet",
                freeLimitTag: "Free", proLimitTag: "PRO: Unlimited", unit: "les."
            }
        };

        let teacherName = tgUser ? (tgUser.first_name || '') : '';
        
        // Чтение сохранённых локально данных
        let students = JSON.parse(localStorage.getItem('app_students_' + userId) || '[]');
        let lessons = JSON.parse(localStorage.getItem('app_lessons_' + userId) || '[]');
        let zoomUrl = localStorage.getItem('app_zoom_' + userId) || '';
        
        let isExpanded = false;
        const FREE_STUDENT_LIMIT = 3;

        document.getElementById('lessonDate').valueAsDate = new Date();

        function saveLocal() {
            localStorage.setItem('app_students_' + userId, JSON.stringify(students));
            localStorage.setItem('app_lessons_' + userId, JSON.stringify(lessons));
            localStorage.setItem('app_zoom_' + userId, zoomUrl);
        }

        function formatDateStr(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function selectLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            applyLocalization();
            render();
        }

        function applyLocalization() {
            const t = i18n[currentLang] || i18n.uk;
            document.getElementById('lblTeacherName').innerText = t.teacherNameLbl;
            document.getElementById('teacherNameInput').placeholder = t.teacherNamePh;
            document.getElementById('lblZoomUrl').innerText = t.zoomUrlLbl;
            document.getElementById('zoomUrl').placeholder = t.zoomUrlPh;
            document.getElementById('btnSaveSettings').innerText = t.saveSettingsBtn;

            document.getElementById('lblCompletedStat').innerText = t.completedStat;
            document.getElementById('lblTodayStat').innerText = t.todayStat;
            document.getElementById('lblStudentsStat').innerText = t.studentsStat;
            document.getElementById('lblEarnedStat').innerText = t.earnedStat;
            document.getElementById('btnStudentBadge').innerText = t.badgeList;

            document.getElementById('lblStudentsSection').innerText = t.studentsSection;
            document.getElementById('studentName').placeholder = t.studentNamePh;
            document.getElementById('studentRate').placeholder = t.studentRatePh;
            document.getElementById('btnAddStudent').innerText = t.addStudentBtn;

            document.getElementById('lblScheduleSection').innerText = t.scheduleSection;
            document.getElementById('btnAddLesson').innerText = t.addLessonBtn;
            document.getElementById('lblScheduleTitle').innerText = t.scheduleTitle;
            document.getElementById('lblModalTitle').innerText = t.modalTitle;
        }

        function toggleSettingsInput() {
            document.getElementById('settingsBar').classList.toggle('active');
        }

        function openZoomLink() {
            if (zoomUrl) window.open(zoomUrl, '_blank');
            else { alert('Вкажіть посилання на Zoom в налаштуваннях!'); toggleSettingsInput(); }
        }

        function openStudentsModal() {
            const t = i18n[currentLang] || i18n.uk;
            const listEl = document.getElementById('modalStudentsList');
            listEl.innerHTML = students.length === 0 
                ? `<p style="color:#94a3b8; font-size:13px; text-align:center;">${t.noStudentsYet}</p>`
                : students.map(s => `<div style="padding:8px; border-bottom:1px solid #334155; display:flex; justify-content:space-between;"><span>👤 ${s.name}</span><span style="color:#3b82f6;">${s.rate} ₴</span></div>`).join('');
            document.getElementById('studentsModal').classList.add('active');
        }

        function closeStudentsModal() {
            document.getElementById('studentsModal').classList.remove('active');
        }

        function updateAppTitle() {
            document.getElementById('appTitle').innerText = teacherName ? `${teacherName}'s English School` : `English School`;
        }

        function toggleSchedule() {
            isExpanded = !isExpanded;
            render();
        }

        async function saveSettings() {
            teacherName = document.getElementById('teacherNameInput').value.trim();
            zoomUrl = document.getElementById('zoomUrl').value.trim();
            saveLocal();
            
            if (db) {
                try {
                    await db.from('config').upsert({ key: `teacher_name_${userId}`, value: teacherName });
                    await db.from('config').upsert({ key: `zoom_url_${userId}`, value: zoomUrl });
                } catch(e){}
            }
            updateAppTitle();
            document.getElementById('settingsBar').classList.remove('active');
            render();
        }

        async function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const rate = parseFloat(document.getElementById('studentRate').value);
            if (!name || isNaN(rate)) return alert('Заполните данные!');

            const newStudent = { id: Date.now(), name, rate, user_id: userId };
            
            students.push(newStudent);
            saveLocal();

            document.getElementById('studentName').value = '';
            document.getElementById('studentRate').value = '';
            render();

            if (db) {
                try {
                    const { error } = await db.from('students').insert([newStudent]);
                    if (error) console.error("Supabase insert error:", error.message);
                } catch(e) {
                    console.error("Supabase connection error:", e);
                }
            }
        }

        async function deleteStudent(id) {
            students = students.filter(s => s.id !== id);
            saveLocal();
            render();

            if (db) {
                try { await db.from('students').delete().eq('id', id); } catch(e){}
            }
        }

        async function addLesson() {
            const dateVal = document.getElementById('lessonDate').value;
            const timeVal = document.getElementById('lessonTime').value;
            const studentId = parseInt(document.getElementById('lessonStudentSelect').value);
            if (!dateVal || !timeVal || !studentId) return alert('Заполните данные!');

            const student = students.find(s => s.id === studentId);
            const newLesson = {
                id: Date.now(),
                day: dateVal,
                lesson_date: dateVal,
                time: timeVal,
                student_name: student ? student.name : 'Студент',
                rate: student ? student.rate : 0,
                completed: false,
                user_id: userId
            };

            lessons.push(newLesson);
            saveLocal();
            render();

            if (db) {
                try { await db.from('lessons').insert([newLesson]); } catch(e){}
            }
        }

        async function toggleLessonStatus(id) {
            const lesson = lessons.find(l => l.id === id);
            if (lesson) {
                lesson.completed = !lesson.completed;
                saveLocal();
                render();
                if (db) {
                    try { await db.from('lessons').update({ completed: lesson.completed }).eq('id', id); } catch(e){}
                }
            }
        }

        async function deleteLesson(id) {
            lessons = lessons.filter(l => l.id !== id);
            saveLocal();
            render();
            if (db) {
                try { await db.from('lessons').delete().eq('id', id); } catch(e){}
            }
        }

        function render() {
            const t = i18n[currentLang] || i18n.uk;
            document.getElementById('limitTag').innerText = `${t.freeLimitTag}: ${students.length} / ${FREE_STUDENT_LIMIT}`;

            const stListEl = document.getElementById('studentsList');
            stListEl.innerHTML = students.map(s => `
                <div class="student-chip">
                    <span><b>${s.name}</b> (${s.rate}₴)</span>
                    <span class="del-btn" onclick="deleteStudent(${s.id})">✕</span>
                </div>
            `).join('');

            const studentSelectEl = document.getElementById('lessonStudentSelect');
            studentSelectEl.innerHTML = `<option value="">${t.selectStudentDef}</option>` + 
                students.map(s => `<option value="${s.id}">${s.name} (${s.rate} ₴)</option>`).join('');

            const now = new Date();
            const todayStr = formatDateStr(now);

            // СТРОИМ ДНИ ОТ СЕГОДНЯ НА 7 ДНЕЙ ВПЕРЕД
            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date();
                d.setDate(now.getDate() + i);
                weekDays.push({ dateKey: formatDateStr(d), dateObj: d });
            }

            let earnedIncomeVal = 0;
            let completedCount = 0;
            let todayLessonsCountVal = 0;

            const groupedLessons = {};
            lessons.forEach(l => {
                const dateKey = l.lesson_date || l.day || todayStr;
                if (!groupedLessons[dateKey]) groupedLessons[dateKey] = [];
                groupedLessons[dateKey].push(l);

                if (l.completed) {
                    earnedIncomeVal += (l.rate || 0);
                    completedCount++;
                }
            });

            const todayObj = weekDays[0];
            const otherDays = weekDays.slice(1);

            function buildCardHtml(dayInfo, isToday = false) {
                const dateKey = dayInfo.dateKey;
                const dateObj = dayInfo.dateObj;
                const dayLessons = (groupedLessons[dateKey] || []).sort((a, b) => (a.time || '').localeCompare(b.time || ''));

                if (isToday) todayLessonsCountVal = dayLessons.length;

                const dayName = t.days[dateObj.getDay()];
                const formattedDate = `${dayName}, ${dateObj.getDate()} ${t.months[dateObj.getMonth()]}`;

                let lessonsHtml = dayLessons.length === 0 
                    ? `<div class="no-lessons">${t.noLessons}</div>`
                    : dayLessons.map(l => `
                        <div class="lesson-card ${l.completed ? 'completed' : ''}">
                            <div class="lesson-info">
                                <span class="lesson-time">${l.time || '15:00'} ${l.completed ? '✓' : ''}</span>
                                <span class="lesson-student">${l.student_name || 'Студент'} (${l.rate || 0}₴)</span>
                            </div>
                            <div class="lesson-actions">
                                ${zoomUrl ? `<a href="${zoomUrl}" target="_blank" class="btn-zoom-icon">🎥 Zoom</a>` : ''}
                                <button class="btn-sm ${l.completed ? 'btn-danger-sm' : 'btn-success-sm'}" onclick="toggleLessonStatus(${l.id})">
                                    ${l.completed ? '↩' : '✓'}
                                </button>
                                <button class="btn-sm btn-danger-sm" onclick="deleteLesson(${l.id})">✕</button>
                            </div>
                        </div>
                    `).join('');

                return `
                    <div class="day-column ${isToday ? 'is-today' : ''}">
                        <div class="day-header">
                            <span>${formattedDate} ${isToday ? t.todayTag : ''}</span>
                            <span>${dayLessons.length} ${t.unit}</span>
                        </div>
                        <div class="lessons-list">${lessonsHtml}</div>
                    </div>
                `;
            }

            const weekGridEl = document.getElementById('weekGrid');
            let html = buildCardHtml(todayObj, true);
            html += `
                <div class="expand-toggle-btn" onclick="toggleSchedule()">
                    <span>${isExpanded ? t.collapseSch : t.expandSch}</span>
                </div>
            `;
            html += `
                <div class="other-days-block ${isExpanded ? 'show' : ''}" id="otherDaysBlock">
                    ${otherDays.map(d => buildCardHtml(d, false)).join('')}
                </div>
            `;
            weekGridEl.innerHTML = html;

            document.getElementById('completedLessonsCount').innerText = `${completedCount} / ${lessons.length}`;
            document.getElementById('todayLessonsCount').innerText = `${todayLessonsCountVal}`;
            document.getElementById('totalStudentsCount').innerText = `${students.length}`;
            document.getElementById('earnedIncome').innerText = `${earnedIncomeVal} ₴`;
        }

        async function loadSupabaseData() {
            if (!db) return;
            try {
                const { data: stData, error: stErr } = await db.from('students').select('*').eq('user_id', userId);
                if (!stErr && stData && stData.length > 0) {
                    const combined = [...students];
                    stData.forEach(serverSt => {
                        if (!combined.some(localSt => localSt.id === serverSt.id)) {
                            combined.push(serverSt);
                        }
                    });
                    students = combined;
                    saveLocal();
                }

                const { data: lsData, error: lsErr } = await db.from('lessons').select('*').eq('user_id', userId);
                if (!lsErr && lsData && lsData.length > 0) {
                    const combinedLessons = [...lessons];
                    lsData.forEach(serverLs => {
                        if (!combinedLessons.some(localLs => localLs.id === serverLs.id)) {
                            combinedLessons.push(serverLs);
                        }
                    });
                    lessons = combinedLessons;
                    saveLocal();
                }

                render();
            } catch (err) {
                console.error("Supabase load error:", err);
            }
        }

        applyLocalization();
        render();
        loadSupabaseData();
    </script>
</body>
</html>
